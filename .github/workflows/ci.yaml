name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: Unit tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }})

    runs-on: ${{ matrix.os }}

    env:
      PHP_EXTENSIONS: curl, json, libxml, mbstring, openssl
      PHP_INI_VALUES: assert.exception=1, zend.assertions=1, pcov.directory=Classes

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

        php-version:
          - "8.4"
          - "8.5"

        dependencies:
          - lowest
          - highest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI_VALUES }}

      - name: Determine composer cache directory on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-

      # Flow 9 still requires psr/http-message 1.x, league/oauth2-server asks for 2.0
      - name: Alias psr/http-message
        run: composer require --no-ansi --no-interaction --no-update "psr/http-message:1.1 as 2.0"

      - name: Install lowest dependencies with composer
        if: matrix.dependencies == 'lowest'
        run: composer update --no-ansi --no-interaction --no-progress --prefer-lowest

      - name: Install highest dependencies with composer
        if: matrix.dependencies == 'highest'
        run: composer update --no-ansi --no-interaction --no-progress

      - name: Show modules
        run: php -i; php -m

      - name: Run tests with phpunit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Send code coverage report to Codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  functional-tests:
    name: Functional tests (${{ matrix.database.name }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.0
            image: mysql:8.0
          - name: MariaDB 10.6
            image: mariadb:10.6

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oauth2_server_testing
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: oauth2_server_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || healthcheck.sh --connect"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: package

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, json, libxml, mbstring, openssl, pdo_mysql

      # The functional tests need a Flow application around the package.
      - name: Create a Flow application with the package
        run: |
          composer create-project --no-install --no-interaction --no-scripts neos/flow-base-distribution:^9.0 application
          cd application
          composer config repositories.package '{"type": "path", "url": "../package", "options": {"versions": {"flownative/oauth2-server": "1.1.x-dev"}}}'
          composer require --no-update --no-interaction "psr/http-message:1.1 as 2.0" "flownative/oauth2-server:@dev"
          composer update --no-ansi --no-interaction --no-progress

      - name: Configure the Testing context for the database
        run: |
          mkdir -p application/Configuration/Testing
          cat > application/Configuration/Testing/Settings.yaml <<'YAML'
          Neos:
            Flow:
              persistence:
                backendOptions:
                  driver: 'pdo_mysql'
                  host: '127.0.0.1'
                  port: 3306
                  user: 'root'
                  password: 'root'
                  dbname: 'oauth2_server_testing'
                  charset: 'utf8mb4'
          Flownative:
            OAuth2:
              Server:
                enabled: true
          YAML

      - name: Run the functional tests
        working-directory: application
        env:
          FLOW_CONTEXT: Testing
        run: bin/phpunit -c Build/BuildEssentials/PhpUnit/FunctionalTests.xml Packages/Application/Flownative.OAuth2.Server/Tests/Functional
